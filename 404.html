<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found | JM-ideal</title>
<meta name="robots" content="noindex, follow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https://wa.me https://formsubmit.co; img-src 'self' data: https:; style-src 'self' 'unsafe-inline';">
<meta http-equiv="X-Frame-Options" content="SAMEORIGIN">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#0b2447 0%,#19376d 100%);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
.container{max-width:500px}
.error-code{font-size:120px;font-weight:800;background:linear-gradient(135deg,#ff8c00,#ffb347);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:10px}
h1{font-size:28px;margin-bottom:15px;color:#fff}
p{font-size:16px;color:rgba(255,255,255,.8);margin-bottom:30px;line-height:1.6}
.btn{display:inline-block;background:#ff8c00;color:#fff;padding:14px 32px;border-radius:8px;text-decoration:none;font-weight:600;font-size:16px;transition:transform .2s,background .2s}
.btn:hover{background:#e67e00;transform:translateY(-2px)}
.btn-secondary{display:inline-block;background:rgba(255,255,255,.15);color:#fff;padding:14px 32px;border-radius:8px;text-decoration:none;font-weight:600;font-size:16px;margin-left:10px;transition:background .2s}
.btn-secondary:hover{background:rgba(255,255,255,.25)}
.logo{font-size:24px;font-weight:800;margin-bottom:30px;color:#ff8c00}
@media(max-width:480px){.error-code{font-size:80px}h1{font-size:22px}.btn,.btn-secondary{display:block;margin:10px 0;width:100%}}
</style>
</head>
<body>
<div class="container">
<div class="logo">JM-ideal</div>
<div class="error-code">404</div>
<h1>Page Not Found</h1>
<p>Sorry, the page you are looking for doesn't exist or has been moved.<br>Please check the URL or return to our homepage.</p>
<a href="/" class="btn">Back to Home</a>
<a href="/products.html" class="btn-secondary">View Products</a>
</div>
</body>
</html>
